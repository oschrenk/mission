name: Release
on:
  push:
    tags:
      - 't*'
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.6'
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Build binaries for mac
        run: ~/go/bin/task release
      - name: Generate checksums
        run: ~/go/bin/task sha
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./.release/mission-darwin-amd64
            ./.release/mission-darwin-amd64.sha256
            ./.release/mission-darwin-arm64
            ./.release/mission-darwin-arm64.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
