name: Release
on:
  push:
    branches:
      - 'release'
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - uses: arduino/setup-task@v2
      - uses: supplypike/setup-bin@v4
        with:
          uri: 'https://github.com/dominikh/go-tools/releases/download/2025.1.1/staticcheck_linux_amd64.tar.gz'
          name: 'staticcheck'
          version: '2025.1.1'
      - name: Debugging stuff
        run: echo $PATH
      - name: Debugging more
        run: ls -la /opt/hostedtoolcache/staticcheck/2025.1.1/x64
      - name: Go mod tidy
        run: go mod tidy
      - name: Build binaries for mac
        run: task artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./.release/mission-darwin-amd64
            ./.release/mission-darwin-arm64
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
